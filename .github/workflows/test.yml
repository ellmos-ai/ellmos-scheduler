name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install --upgrade pip build ruff && python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel into isolated target
        run: python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--target', '.wheel-smoke', str(wheel)])"
      - name: Smoke-test installed wheel and IANA timezone
        run: python -c "import sys; sys.path.insert(0, '.wheel-smoke'); import ellmos_scheduler; from zoneinfo import ZoneInfo; assert ellmos_scheduler.__version__ == '0.2.2'; assert ZoneInfo('Europe/Berlin').key == 'Europe/Berlin'"
