name: tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: >-
          python -m pip install
          build==1.5.1
          pytest==9.1.1
          ruff==0.15.18
          setuptools==80.9.0
          wheel==0.45.1
          "tomli==2.2.1; python_version < '3.11'"
          && python -m pip install --no-build-isolation -e .
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: Build wheel
        run: python -m build --wheel --no-isolation
      - name: Install wheel into isolated target
        run: python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--target', '.wheel-smoke', str(wheel)])"
      - name: Smoke-test installed wheel and IANA timezone
        run: python -c "import sys; sys.path.insert(0, '.wheel-smoke'); import ellmos_scheduler; from importlib.metadata import version; from zoneinfo import ZoneInfo; assert ellmos_scheduler.__version__ == version('ellmos-scheduler'); assert ZoneInfo('Europe/Berlin').key == 'Europe/Berlin'"
