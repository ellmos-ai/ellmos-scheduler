[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ellmos-scheduler"
version = "0.3.6"
description = "Standalone, modular scheduler for ellmos stacks and BACH adapters"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.10"
authors = [{ name = "Lukas Geiger" }]
dependencies = [
  "tzdata>=2024.1; platform_system == 'Windows'",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/ellmos-scheduler"
Repository = "https://github.com/ellmos-ai/ellmos-scheduler.git"
Issues = "https://github.com/ellmos-ai/ellmos-scheduler/issues"
Changelog = "https://github.com/ellmos-ai/ellmos-scheduler/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ellmos-ai/ellmos-scheduler#readme"
Security = "https://github.com/ellmos-ai/ellmos-scheduler/blob/main/SECURITY.md"
"Third-Party Licenses" = "https://github.com/ellmos-ai/ellmos-scheduler/blob/main/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/ellmos-ai/ellmos-scheduler/blob/main/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/ellmos-ai/ellmos-scheduler/blob/main/llms.txt"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "tomli>=2; python_version < '3.11'",
]

[project.scripts]
ellmos-scheduler = "ellmos_scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -v"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

